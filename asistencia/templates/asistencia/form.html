<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ titulo }} - TecnoAndes S.A.C.</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        background: #f1f5f9;
        padding: 2rem 1rem;
        color: #0f172a;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      }
      h2 {
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 0.8rem;
        font-size: 0.9rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        margin-top: 0.25rem;
      }
      button {
        margin-top: 1.25rem;
        background: #1d4ed8;
        color: #fff;
        border: 0;
        padding: 0.7rem 1.2rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      a {
        display: inline-block;
        margin-left: 0.9rem;
        color: #475569;
        text-decoration: none;
      }
      .errorlist {
        color: #dc2626;
        font-size: 0.85rem;
        padding-left: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>{{ titulo }}</h2>
      <form method="post">
        {% csrf_token %} {{ form.non_field_errors }} {{ form.as_p }}
        <button type="submit">Guardar registro</button>
        <a href="/">Volver al panel</a>
      </form>
    </div>
  </body>
</html>
