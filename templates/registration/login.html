<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoAndes S.A.C. - Acceso</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
      }
      .card {
        width: 100%;
        max-width: 390px;
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
      }
      h2 {
        margin: 0 0 0.3rem;
        color: #0f172a;
      }
      p.sub {
        margin: 0 0 1.4rem;
        color: #64748b;
        font-size: 0.9rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        margin-top: 0.25rem;
      }
      button {
        width: 100%;
        margin-top: 1.25rem;
        padding: 0.7rem;
        background: #1d4ed8;
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .errorlist {
        color: #dc2626;
        font-size: 0.85rem;
        padding-left: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>TecnoAndes S.A.C.</h2>
      <p class="sub">Control de Asistencia y Permisos</p>
      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </body>
</html>
